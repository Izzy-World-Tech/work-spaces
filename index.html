<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plantly | Water Reminders</title>
    <meta
      name="description"
      content="A plant watering tracker with countdown timers, custom plant names, and icon uploads."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap" aria-label="Plantly brand">
          <div class="brand-mark">🌿</div>
          <div>
            <p class="brand-kicker">Plant care</p>
            <h1>Plantly</h1>
          </div>
        </div>

        <div class="topbar-actions">
          <button id="notification-toggle" class="toolbar-button" type="button">Enable reminders</button>
          <button id="theme-toggle" class="toolbar-button" type="button" aria-label="Toggle dark mode">🌙 Dark mode</button>
          <div class="status-badge" id="plant-summary">0 plants</div>
        </div>
      </header>

      <main class="app-layout">
        <section class="panel form-panel" aria-labelledby="add-plant-heading">
          <div class="panel-header">
            <p class="eyebrow">Add a plant</p>
            <h2 id="add-plant-heading">Keep your greenery happy</h2>
          </div>

          <form id="plant-form" class="plant-form">
            <label class="field">
              <span>Plant name</span>
              <input id="plant-name" name="plantName" type="text" placeholder="Monstera" maxlength="30" required />
            </label>

            <label class="field">
              <span>Water every</span>
              <div class="input-inline">
                <input id="watering-interval" name="wateringInterval" type="number" min="1" max="60" value="3" required />
                <span>days</span>
              </div>
            </label>

            <div class="field">
              <span>Choose an icon</span>
              <div id="icon-grid" class="icon-grid" aria-label="Plant icon options">
                <button type="button" class="icon-option selected" data-icon="🌱" aria-label="Plant icon leaf">🌱</button>
                <button type="button" class="icon-option" data-icon="🌿" aria-label="Plant icon sprout">🌿</button>
                <button type="button" class="icon-option" data-icon="🍃" aria-label="Plant icon leaf">🍃</button>
                <button type="button" class="icon-option" data-icon="🌵" aria-label="Cactus icon">🌵</button>
                <button type="button" class="icon-option" data-icon="🪴" aria-label="Potted plant icon">🪴</button>
                <button type="button" class="icon-option" data-icon="🌼" aria-label="Flower icon">🌼</button>
                <button type="button" class="icon-option" data-icon="🌳" aria-label="Tree icon">🌳</button>
                <button type="button" class="icon-option" data-icon="🌾" aria-label="Grass icon">🌾</button>
              </div>
            </div>

            <div class="field">
              <span>Or upload your own</span>
              <label class="upload-box" for="icon-upload">
                <input id="icon-upload" type="file" accept="image/*" />
                <span>Choose image</span>
              </label>
              <div id="upload-preview" class="upload-preview" aria-live="polite"></div>
            </div>

            <button type="submit" class="primary-button">Add plant</button>
          </form>
        </section>

        <section class="panel list-panel" aria-labelledby="plant-list-heading">
          <div class="panel-header split-header">
            <div>
              <p class="eyebrow">Your schedule</p>
              <h2 id="plant-list-heading">Watering tracker</h2>
            </div>
            <button id="seed-demo" class="secondary-button" type="button">Load demo</button>
          </div>

          <div id="plant-list" class="plant-list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
